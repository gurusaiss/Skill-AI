version: '3.9'

services:
  # ── SkillForge AI Server ──────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
        APP_COMMIT: ${APP_COMMIT:-unknown}
    image: skillforge-ai:local
    container_name: skillforge-server
    restart: unless-stopped
    ports:
      - '3001:3001'
    # Every variable in .env reaches the container, including ones added later
    # (extra Gemini keys, OpenRouter, generation settings). Before this, only the
    # names listed under `environment` were passed through and new keys were
    # silently dropped.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASESERVICE_ROLE_KEY: ${SUPABASESERVICE_ROLE_KEY}
      FRONTEND_URL: http://localhost:5173
    volumes:
      - skillforge-data:/app/server/data
    networks:
      - skillforge-net
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Vite Dev Client (development only) ───────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: skillforge-client
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:3001
    volumes:
      - ./client/src:/app/src
    networks:
      - skillforge-net
    depends_on:
      server:
        condition: service_healthy
    profiles:
      - dev

  # ── Redis (optional caching layer) ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: skillforge-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - skillforge-net
    profiles:
      - full

  # ── Self-hosted MySQL (optional — the dual-write mirror, see docs/mysql.report.md) ──
  # Off by default: only starts with `docker compose --profile mysql up -d`.
  # sql/mysql_schema.sql is mounted into docker-entrypoint-initdb.d, which the
  # official MySQL image runs automatically — but ONLY the very first time it
  # starts with an empty data volume. A later schema change needs a manual run
  # (`docker compose exec mysql mysql -u root -p skillforge < sql/mysql_schema.sql`),
  # it will not re-apply on its own.
  # Port 3306 is intentionally NOT published to the host here (no `ports:`) — the
  # app reaches it over the private `skillforge-net` network only, at hostname
  # `mysql`, which is why MYSQL_HOST=mysql (not an IP) is correct in .env. Add a
  # `ports: ['3306:3306']` line yourself only if you specifically need to connect
  # a desktop MySQL client from outside the server — doing so on a real machine
  # exposes the database to the internet unless your own firewall blocks it.
  mysql:
    image: mysql:8
    container_name: skillforge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-skillforge}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/mysql_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - skillforge-net
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    profiles:
      - mysql

volumes:
  skillforge-data:
  redis-data:
  mysql-data:

networks:
  skillforge-net:
    driver: bridge
